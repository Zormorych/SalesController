# Todo (base de datos + backend + frontend):   docker compose up -d --build
# Sin el frontend:                             docker compose up -d --build postgres app
# Solo la base de datos (para desarrollar con IntelliJ):   docker compose up -d postgres
# Los valores entre ${...} se pueden cambiar en un fichero .env (ver .env.example).
# El frontend se construye desde su propio repositorio (SalesController-web), que debe estar en WEB_DIR
services:
  postgres:
    image: postgres:17-alpine
    container_name: sales-manager-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_manager}
      POSTGRES_USER: ${POSTGRES_USER:-sales_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sales_manager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sales_manager} -d ${POSTGRES_DB:-sales_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    image: sales-manager-backend:local
    container_name: sales-manager-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Sin esto la JVM del contenedor usa UTC y un pedido creado a las 00:30 quedaría con fecha de ayer
      TZ: ${TZ:-Europe/Madrid}
      # Dentro de la red de Docker la base de datos se llama "postgres", no "localhost"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sales_manager}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sales_manager}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sales_manager}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Angular servido por nginx. nginx pasa las llamadas /api al backend por la red interna de Docker,
  # así que el navegador solo habla con el frontend y no hace falta CORS
  web:
    build: ${WEB_DIR:-../SalesController-web}
    image: sales-controller-web:local
    container_name: sales-controller-web
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Dentro de la red de Docker el backend se llama "app" y escucha en su puerto interno, el 8080
      BACKEND_URL: http://app:8080
    ports:
      - "${WEB_PORT:-4200}:80"
    restart: unless-stopped

volumes:
  postgres_data:
