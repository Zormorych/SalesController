spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sales_manager}
    username: ${SPRING_DATASOURCE_USERNAME:sales_manager}
    password: ${SPRING_DATASOURCE_PASSWORD:sales_manager}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
