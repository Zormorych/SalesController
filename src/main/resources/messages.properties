# Textos en español para los errores que genera Spring MVC (ProblemDetail).
# Claves: problemDetail.title.<excepción> para el título y problemDetail.<excepción> para el detalle.

problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Recurso no encontrado
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=La ruta solicitada no existe.

problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Petición no válida
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=El cuerpo de la petición no tiene un formato válido.

problemDetail.title.org.springframework.web.bind.MissingServletRequestParameterException=Petición no válida
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Falta el parámetro obligatorio {0}.

problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Petición no válida
problemDetail.org.springframework.beans.TypeMismatchException=El valor del parámetro {0} no es válido.

problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Método no permitido
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=El método {0} no está permitido en esta ruta.

problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Tipo de contenido no soportado
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=El tipo de contenido {0} no está soportado.

# Regla: ResponseStatusException se usa solo para 400 (por ejemplo, un rango de fechas invertido en los informes).
# Para 404 y 409 están ResourceNotFoundException y BusinessRuleException.
problemDetail.title.org.springframework.web.server.ResponseStatusException=Petición no válida
