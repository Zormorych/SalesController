name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior que siga en curso
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y testear
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, tests y verificación de módulos
        run: ./mvnw -B -ntp verify

      - name: Guardar informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
