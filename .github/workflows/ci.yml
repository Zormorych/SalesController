name: CI

# Solo "push": sus checks se asocian al commit y aparecen también en el PR abierto de esa rama.
# Añadir "pull_request" haría que cada push a una rama con PR ejecutase el pipeline dos veces.
on:
  push:
    branches: ["**"]
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions para lanzarlo a mano

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior que siga en curso
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cada job es una "stage" (como en GitLab). "needs" fija el orden:
#   compile ──┬── test ─────────┬── package
#             └── architecture ─┘
# Cada job arranca en una máquina limpia; la caché de Maven evita descargar las dependencias cada vez.
jobs:
  compile:
    name: Compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar código y tests
        run: ./mvnw -B -ntp test-compile

  test:
    name: Tests
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ejecutar tests
        run: ./mvnw -B -ntp test "-Dtest=!ModularityTests"
      - name: Guardar informes de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  architecture:
    name: Arquitectura (módulos)
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verificar límites entre módulos
        run: ./mvnw -B -ntp test -Dtest=ModularityTests
      - name: Guardar diagramas de módulos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-diagrams
          path: target/spring-modulith-docs/
          retention-days: 7

  package:
    name: Empaquetar
    needs: [test, architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Los tests ya se han ejecutado en los jobs anteriores
      - name: Generar el .jar
        run: ./mvnw -B -ntp package -DskipTests
      - name: Guardar el .jar
        uses: actions/upload-artifact@v7
        with:
          name: sales-manager-backend-jar
          path: target/*.jar
          retention-days: 7
