name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior que siga en curso
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cada job es una "stage" (como en GitLab). "needs" fija el orden:
#   compile ──┬── test ─────────┬── package (.jar)
#             └── architecture ─┴── docker  (imagen)
# Cada job arranca en una máquina limpia; la caché de Maven evita descargar las dependencias cada vez.
jobs:
  compile:
    name: Compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar código y tests
        run: ./mvnw -B -ntp test-compile

  test:
    name: Tests
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ejecutar tests
        run: ./mvnw -B -ntp test "-Dtest=!ModularityTests"
      - name: Guardar informes de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  architecture:
    name: Arquitectura (módulos)
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verificar límites entre módulos
        run: ./mvnw -B -ntp test -Dtest=ModularityTests
      - name: Guardar diagramas de módulos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-diagrams
          path: target/spring-modulith-docs/
          retention-days: 7

  package:
    name: Empaquetar
    needs: [test, architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Los tests ya se han ejecutado en los jobs anteriores
      - name: Generar el .jar
        run: ./mvnw -B -ntp package -DskipTests
      - name: Guardar el .jar
        uses: actions/upload-artifact@v7
        with:
          name: sales-manager-backend-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Imagen Docker
    needs: [test, architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Solo comprueba que el Dockerfile construye la imagen; no la publica en ningún registro
      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sales-manager-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
